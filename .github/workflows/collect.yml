name: Collecte Polymarket

on:
  schedule:
    - cron: "17 * * * *"   # toutes les heures, à la 17e minute (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collecter et noter
        run: python scripts/collect.py
      - name: Archiver
        run: |
          git config user.name "polymarket-studio-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -m "Collecte $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
